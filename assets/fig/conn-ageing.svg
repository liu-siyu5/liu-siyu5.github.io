<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" aria-labelledby="ti de">
<title id="ti">Accelerated ageing programme</title><desc id="de">Connectors were soaked in ovens across a range of temperatures, then measured for insertion and withdrawal force. Insertion force changes little. Withdrawal force holds, then falls away past a knee, which points at stress relaxation in the contact springs.</desc>
<style>
  .ts{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#4A5552}
  .th{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .leader{stroke:#A8AEA9;stroke-width:.6;stroke-dasharray:3 3;fill:none}
</style>

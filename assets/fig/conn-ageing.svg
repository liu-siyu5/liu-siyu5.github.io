 markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
 stroke="#8B928D" stroke-width="1.5" stroke-linecap="round"
 stroke-linejoin="round"/></marker>
<pattern id="hx" width="8" height="8" patternUnits="userSpaceOnUse"
 patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8"
 stroke="#7f8b86" stroke-width="0.7"/></pattern></defs>
<rect x="48" y="44" width="120" height="66" rx="6" fill="#F1EFE8" stroke="#6F6E69" stroke-width="0.7"/>
<text class="th" x="108" y="76" text-anchor="middle">Oven</text>
<text class="ts" x="108" y="96" text-anchor="middle">lower</text>
<line x1="108" y1="110" x2="108" y2="136" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="198" y="44" width="120" height="66" rx="6" fill="#F1EFE8" stroke="#6F6E69" stroke-width="0.7"/>
<text class="th" x="258" y="76" text-anchor="middle">Oven</text>
<line x1="258" y1="110" x2="258" y2="136" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="348" y="44" width="120" height="66" rx="6" fill="#F1EFE8" stroke="#6F6E69" stroke-width="0.7"/>
<text class="th" x="408" y="76" text-anchor="middle">Oven</text>
<line x1="408" y1="110" x2="408" y2="136" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="498" y="44" width="120" height="66" rx="6" fill="#F1EFE8" stroke="#6F6E69" stroke-width="0.7"/>
<text class="th" x="558" y="76" text-anchor="middle">Oven</text>
<text class="ts" x="558" y="96" text-anchor="middle">higher</text>
<line x1="558" y1="110" x2="558" y2="136" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<text class="ts" x="348" y="28" text-anchor="middle">Soak temperature rises across the set</text>
<rect x="48" y="142" width="570" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
<text class="th" x="333" y="164" text-anchor="middle">Soak, then measure insertion and withdrawal force</text>
<text class="ts" x="333" y="182" text-anchor="middle">every part number, every temperature</text>
<line x1="120" y1="390" x2="540" y2="390" stroke="#A8AEA9" stroke-width="0.8"/>
<line x1="120" y1="240" x2="120" y2="390" stroke="#A8AEA9" stroke-width="0.8"/>
<path d="M120 348 L225 346.5 L330 343.5 L435 339 L540 333" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>

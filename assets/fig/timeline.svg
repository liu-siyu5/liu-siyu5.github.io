<svg xmlns="http://www.w3.org/2000/svg" width="680" height="552" viewBox="0 0 680 552" role="img" aria-labelledby="ti de">
<title id="ti">Staged bring-up of the validation cell</title><desc id="de">Eight stages, from verifying the arm alone through to the planner change that met the 2 mm target.</desc>
<style>
  .t{font:400 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .ts{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#4A5552}
  .th{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .box{fill:#fff;stroke:#C9CEC9}
  .arr{stroke:#8B928D;stroke-width:1.1;fill:none}
  .leader{stroke:#A8AEA9;stroke-width:.6;stroke-dasharray:3 3;fill:none}
  .c-teal rect,.c-teal circle{fill:#E1F5EE;stroke:#0F6E56}
  .c-teal .th{fill:#085041}.c-teal .t{fill:#085041}.c-teal .ts{fill:#0F6E56}
  .c-purple rect{fill:#EEEDFE;stroke:#534AB7}
  .c-purple .th{fill:#3C3489}.c-purple .t{fill:#3C3489}.c-purple .ts{fill:#534AB7}
  .c-coral rect{fill:#FAECE7;stroke:#993C1D}
  .c-coral .th{fill:#712B13}.c-coral .t{fill:#712B13}.c-coral .ts{fill:#993C1D}
  .c-gray rect{fill:#F1EFE8;stroke:#6F6E69}
  .c-gray .th{fill:#444441}.c-gray .t{fill:#444441}.c-gray .ts{fill:#5F5E5A}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
 markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
 stroke="#8B928D" stroke-width="1.5" stroke-linecap="round"
 stroke-linejoin="round"/></marker></defs>
<line x1="70" y1="64" x2="70" y2="498" stroke="#C9CEC9" stroke-width=".8"/>
<circle cx="70" cy="64" r="4.2" fill="#0F6E56"/>
<g class="c-teal"><rect x="100" y="40" width="520" height="48" rx="8" stroke-width=".7"/><text class="th" x="120" y="60">Arm in isolation</text><text class="ts" x="120" y="78">Verified commanded motion before anything was attached</text></g>
<circle cx="70" cy="126" r="4.2" fill="#0F6E56"/>
<g class="c-teal"><rect x="100" y="102" width="520" height="48" rx="8" stroke-width=".7"/><text class="th" x="120" y="122">Cell layout and 1:1 mockups</text><text class="ts" x="120" y="140">Test unit still in transit; built stand-ins with the mechanical team</text></g>
<circle cx="70" cy="188" r="4.2" fill="#0F6E56"/>
<g class="c-teal"><rect x="100" y="164" width="520" height="48" rx="8" stroke-width=".7"/><text class="th" x="120" y="184">Simulation pass</text><text class="ts" x="120" y="202">Checked reach and clearance against the layout before build</text></g>
<circle cx="70" cy="250" r="4.2" fill="#0F6E56"/>
<g class="c-teal"><rect x="100" y="226" width="520" height="48" rx="8" stroke-width=".7"/><text class="th" x="120" y="246">Repeatability measurement</text><text class="ts" x="120" y="264">Laser pointer against a fixed external reference, repeated cycles</text></g>
<circle cx="70" cy="312" r="4.2" fill="#0F6E56"/>
<g class="c-teal"><rect x="100" y="288" width="520" height="48" rx="8" stroke-width=".7"/><text class="th" x="120" y="308">Camera and gripper added</text><text class="ts" x="120" y="326">Brought up communication between arm and vision hardware</text></g>
<circle cx="70" cy="374" r="4.2" fill="#0F6E56"/>
<g class="c-teal"><rect x="100" y="350" width="520" height="48" rx="8" stroke-width=".7"/><text class="th" x="120" y="370">Calibration chain</text><text class="ts" x="120" y="388">Camera intrinsics, then hand-eye, then tool centre point</text></g>
<circle cx="70" cy="436" r="4.2" fill="#0F6E56"/>
<g class="c-teal"><rect x="100" y="412" width="520" height="48" rx="8" stroke-width=".7"/><text class="th" x="120" y="432">AprilTag pose detection</text><text class="ts" x="120" y="450">Target poses supplied by vision rather than taught by hand</text></g>
<circle cx="70" cy="498" r="4.2" fill="#993C1D"/>
<g class="c-coral"><rect x="100" y="474" width="520" height="48" rx="8" stroke-width=".7"/><text class="th" x="120" y="494">Planner change</text><text class="ts" x="120" y="512">Sampling-based planning missed the 2 mm target; switched to Pilz PTP</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="630" viewBox="0 0 680 630" role="img" aria-labelledby="ti de">
<title id="ti">Column guidance</title><desc id="de">The electric cylinder runs up the centre of the sleeve and provides axial thrust only. Four linear guides, one in each corner of the sleeve section, take the overturning moment, which can arrive from any bearing because the beam above swings.</desc>
<style>
  .t{font:400 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .ts{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#4A5552}
  .th{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .leader{stroke:#A8AEA9;stroke-width:.6;stroke-dasharray:3 3;fill:none}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
 markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
 stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round"
 stroke-linejoin="round"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
 markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
 stroke="#8B928D" stroke-width="1.5" stroke-linecap="round"
 stroke-linejoin="round"/></marker></defs>
<rect x="250" y="60" width="180" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<rect x="272" y="86" width="136" height="150" rx="0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<rect x="250" y="236" width="180" height="190" rx="0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<rect x="316" y="104" width="48" height="300" rx="4" fill="none" stroke="#A8AEA9" stroke-width="0.8" stroke-dasharray="6 4"/>
<rect x="281" y="104" width="10" height="300" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
<rect x="389" y="104" width="10" height="300" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
<line x1="340" y1="40" x2="340" y2="440" stroke="#A8AEA9" stroke-width="0.5" stroke-dasharray="12 4 3 4"/>
<line x1="438" y1="73" x2="486" y2="73" class="leader"/>
<text class="ts" x="494" y="77" text-anchor="start">Beam mounts here</text>
<line x1="340" y1="110" x2="486" y2="110" class="leader"/>
<text class="ts" x="494" y="114" text-anchor="start">Electric cylinder, thrust only</text>
<line x1="286" y1="180" x2="240" y2="180" class="leader"/>
<text class="ts" x="232" y="184" text-anchor="end">Linear guides</text>
<line x1="250" y1="300" x2="204" y2="300" class="leader"/>
<text class="ts" x="196" y="296" text-anchor="end">Outer sleeve</text>
<line x1="274" y1="150" x2="204" y2="150" class="leader"/>
<text class="ts" x="196" y="146" text-anchor="end">Inner sleeve</text>
<g><rect x="120" y="470" width="120" height="120" rx="6" fill="none" stroke="#C9CEC9" stroke-width="0.7"/></g>
<rect x="150" y="500" width="60" height="60" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
<circle cx="156" cy="506" r="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
<circle cx="204" cy="506" r="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
<circle cx="156" cy="554" r="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
<circle cx="204" cy="554" r="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
<text class="ts" x="180" y="608" text-anchor="middle">Guides at the four corners</text>
<path d="M300 512 A56 56 0 0 1 300 568" fill="none" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ag)"/>
<text class="ts" x="322" y="520" text-anchor="start">Overturning moment</text>
<text class="ts" x="322" y="536" text-anchor="start">arrives from any</text>
<text class="ts" x="322" y="552" text-anchor="start">bearing, because the</text>
<text class="ts" x="322" y="568" text-anchor="start">beam above can swing</text>
</svg>

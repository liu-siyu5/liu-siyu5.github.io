<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" aria-labelledby="ti de">
<title id="ti">Camera rotary stage worm drive</title><desc id="de">In section the camera platform sits on a turntable plate carried by a centre sleeve in two pairs of bearings, with the worm wheel clamped to the sleeve and the worm meeting it end on. In plan the worm lies tangent to the wheel, driven through a coupling by the motor.</desc>

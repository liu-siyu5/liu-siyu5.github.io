<svg xmlns="http://www.w3.org/2000/svg" width="680" height="412" viewBox="0 0 680 412" role="img" aria-labelledby="ti de">
<title id="ti">Correcting an action before it runs</title><desc id="de">The safety condition divides the action space in two. An action the policy proposes on the unsafe side is moved the shortest distance onto the boundary and that corrected action is what executes.</desc>
<style>
  .ts{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#4A5552}
  .th{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .leader{stroke:#A8AEA9;stroke-width:.6;stroke-dasharray:3 3;fill:none}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
 markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
 stroke="#8B928D" stroke-width="1.5" stroke-linecap="round"
 stroke-linejoin="round"/></marker>
<marker id="art" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
 markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
 stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round"
 stroke-linejoin="round"/></marker>
<marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
 markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
 stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round"
 stroke-linejoin="round"/></marker></defs>
<rect x="90" y="60" width="440" height="300" rx="6" fill="#FCFCFB" stroke="#DCE0DC" stroke-width="0.6"/>
<path d="M90 300 L530 140 L530 360 L90 360 Z" fill="#FCEBEB"/>
<line x1="90" y1="300" x2="530" y2="140" stroke="#A32D2D" stroke-width="1.4"/>
<text class="ts" x="300" y="112" text-anchor="start">actions whose predicted force</text>
<text class="ts" x="300" y="130" text-anchor="start">stays under the limit</text>
<text class="ts" x="150" y="336" text-anchor="start">actions that would exceed it</text>
<circle cx="200" cy="255" r="5" fill="#16211F"/>
<text class="ts" x="180" y="248" text-anchor="end">current state</text>
<line x1="200" y1="255" x2="352" y2="316" stroke="#A32D2D" stroke-width="1.4" marker-end="url(#ard)"/>
<text class="ts" x="360" y="330" text-anchor="start">what the policy asked for</text>
<line x1="200" y1="255" x2="286" y2="180" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#art)"/>
<text class="ts" x="294" y="176" text-anchor="start">what actually runs</text>
<line x1="352" y1="316" x2="286" y2="180" stroke="#A8AEA9" stroke-width="0.7" stroke-dasharray="5 4"/>
<text class="ts" x="338" y="252" text-anchor="start">smallest correction</text>
<text class="ts" x="338" y="268" text-anchor="start">that satisfies it</text>
<text class="ts" x="40" y="392" text-anchor="start">The force condition becomes one linear constraint on the action, so the correction is a projection, not a search.</text>
</svg>

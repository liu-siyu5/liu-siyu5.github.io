<circle cx="580" cy="136" r="2.4" fill="#D85A30"/>
<circle cx="569" cy="144" r="2.4" fill="#D85A30"/>
<circle cx="576" cy="148" r="2.4" fill="#D85A30"/>
<circle cx="573" cy="141" r="2.4" fill="#D85A30"/>
<circle cx="582" cy="140" r="2.4" fill="#D85A30"/>
<text class="ts" x="310" y="118" text-anchor="middle">Laser pointer on the flange</text>
<text class="ts" x="110" y="320" text-anchor="middle">Franka Panda</text>
<text class="ts" x="420" y="230" text-anchor="middle">Fixed reference plate</text>

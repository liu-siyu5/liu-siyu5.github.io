<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-labelledby="ti de">
<title id="ti">Repeatability measurement setup</title><desc id="de">A laser pointer on the flange projects onto a fixed reference plate; the scatter of the spot over repeated return cycles gives the repeatability.</desc>
<style>
  .t{font:400 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .ts{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#4A5552}
  .th{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .box{fill:#fff;stroke:#C9CEC9}
  .arr{stroke:#8B928D;stroke-width:1.1;fill:none}
  .leader{stroke:#A8AEA9;stroke-width:.6;stroke-dasharray:3 3;fill:none}
  .c-teal rect,.c-teal circle{fill:#E1F5EE;stroke:#0F6E56}
  .c-teal .th{fill:#085041}.c-teal .t{fill:#085041}.c-teal .ts{fill:#0F6E56}
  .c-purple rect{fill:#EEEDFE;stroke:#534AB7}
  .c-purple .th{fill:#3C3489}.c-purple .t{fill:#3C3489}.c-purple .ts{fill:#534AB7}
  .c-coral rect{fill:#FAECE7;stroke:#993C1D}
  .c-coral .th{fill:#712B13}.c-coral .t{fill:#712B13}.c-coral .ts{fill:#993C1D}
  .c-gray rect{fill:#F1EFE8;stroke:#6F6E69}
  .c-gray .th{fill:#444441}.c-gray .t{fill:#444441}.c-gray .ts{fill:#5F5E5A}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
 markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
 stroke="#8B928D" stroke-width="1.5" stroke-linecap="round"
 stroke-linejoin="round"/></marker></defs>
<path d="M110 270 L110 170 L200 120 L280 140" fill="none" stroke="#CDD2CD" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g class="c-gray"><rect x="70" y="270" width="80" height="30" rx="4" stroke-width=".7"/></g>
<circle cx="110" cy="170" r="6.5" fill="#A8AEA9"/>
<circle cx="200" cy="120" r="6.5" fill="#A8AEA9"/>
<g class="c-gray"><rect x="270" y="128" width="18" height="24" rx="3" stroke-width=".7"/></g>
<g class="c-coral"><rect x="288" y="132" width="44" height="16" rx="3" stroke-width=".7"/></g>
<line x1="332" y1="140" x2="450" y2="140" stroke="#D85A30" stroke-width="1.4"/>
<g class="c-gray"><rect x="452" y="75" width="18" height="130" rx="2" stroke-width=".7"/></g>
<line x1="470" y1="140" x2="508" y2="140" class="leader"/>
<rect class="box" x="510" y="75" width="130" height="130" rx="8" stroke-width=".7"/>
<line x1="555" y1="140" x2="595" y2="140" stroke="#A8AEA9" stroke-width=".7"/>
<line x1="575" y1="120" x2="575" y2="160" stroke="#A8AEA9" stroke-width=".7"/>
<circle cx="571" cy="137" r="2.4" fill="#D85A30"/>

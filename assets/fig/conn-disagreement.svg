<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img" aria-labelledby="ti de">
<title id="ti">When the model and the bench disagreed</title><desc id="de">The model set an expectation. The measured withdrawal force came back far looser than it should have been. Rather than tune the model to match, the question was which side was wrong; the samples turned out to be a different size than recorded, and the test was rerun.</desc>
<style>
  .ts{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#4A5552}
  .th{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .leader{stroke:#A8AEA9;stroke-width:.6;stroke-dasharray:3 3;fill:none}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
 markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
 stroke="#8B928D" stroke-width="1.5" stroke-linecap="round"
 stroke-linejoin="round"/></marker>
<pattern id="hx" width="8" height="8" patternUnits="userSpaceOnUse"
 patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8"
 stroke="#7f8b86" stroke-width="0.7"/></pattern></defs>
<rect x="150" y="40" width="380" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><text class="th" x="340" y="62" text-anchor="middle" fill="#085041">Model gives an expectation</text><text class="ts" x="340" y="80" text-anchor="middle" fill="#0F6E56">contact, friction, material nonlinearity</text>
<line x1="340" y1="98" x2="340" y2="122" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="150" y="128" width="380" height="58" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.9"/><text class="th" x="340" y="150" text-anchor="middle" fill="#712B13">Measured force comes back</text><text class="ts" x="340" y="168" text-anchor="middle" fill="#993C1D">far looser than it should be</text>
<line x1="340" y1="186" x2="340" y2="210" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="150" y="216" width="380" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><text class="th" x="340" y="238" text-anchor="middle" fill="#085041">Judge which side is wrong</text><text class="ts" x="340" y="256" text-anchor="middle" fill="#0F6E56">the model had a reason, the data did not</text>
<line x1="340" y1="274" x2="340" y2="298" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="150" y="304" width="380" height="58" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.9"/><text class="th" x="340" y="326" text-anchor="middle" fill="#712B13">Trace it to the samples</text><text class="ts" x="340" y="344" text-anchor="middle" fill="#993C1D">a size had been mixed up in the batch</text>
<line x1="340" y1="362" x2="340" y2="386" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="150" y="392" width="380" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><text class="th" x="340" y="414" text-anchor="middle" fill="#085041">Rerun the test</text><text class="ts" x="340" y="432" text-anchor="middle" fill="#0F6E56">with the batch identified correctly</text>
</svg>

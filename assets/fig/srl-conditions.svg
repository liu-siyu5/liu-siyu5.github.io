<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" role="img" aria-labelledby="ti de">
<title id="ti">Where each mechanism intervenes</title><desc id="de">Within one control step the action is proposed, executed, and the resulting force measured. C1 never intervenes. C2 records a cost at the measurement point without altering the action. C3 acts only after force is measured. C4 acts between proposal and execution.</desc>
<style>
  .ts{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#4A5552}
  .th{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
 markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
 stroke="#8B928D" stroke-width="1.5" stroke-linecap="round"
 stroke-linejoin="round"/></marker></defs>
<line x1="160" y1="68" x2="636" y2="68" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<line x1="200" y1="62" x2="200" y2="74" stroke="#A8AEA9" stroke-width="0.7"/>
<text class="ts" x="200" y="50" text-anchor="middle">action proposed</text>
<line x1="200" y1="80" x2="200" y2="330" stroke="#A8AEA9" stroke-width="0.5" stroke-dasharray="4 5"/>
<line x1="390" y1="62" x2="390" y2="74" stroke="#A8AEA9" stroke-width="0.7"/>
<text class="ts" x="390" y="50" text-anchor="middle">action executed</text>
<line x1="390" y1="80" x2="390" y2="330" stroke="#A8AEA9" stroke-width="0.5" stroke-dasharray="4 5"/>
<line x1="570" y1="62" x2="570" y2="74" stroke="#A8AEA9" stroke-width="0.7"/>
<text class="ts" x="570" y="50" text-anchor="middle">force measured</text>
<line x1="570" y1="80" x2="570" y2="330" stroke="#A8AEA9" stroke-width="0.5" stroke-dasharray="4 5"/>
<text class="th" x="40" y="112">C1</text>
<text class="ts" x="40" y="130">unconstrained</text>
<text class="ts" x="390" y="118" text-anchor="middle">never intervenes</text>
<text class="th" x="40" y="182">C2</text>
<text class="ts" x="40" y="200">reward penalty</text>
<rect x="505" y="168" width="130" height="34" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8" stroke-dasharray="5 4"/>
<text class="ts" x="570" y="189" text-anchor="middle" fill="#633806">records a cost</text>
<text class="th" x="40" y="252">C3</text>
<text class="ts" x="40" y="270">reactive shield</text>
<rect x="505" y="238" width="130" height="34" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text class="ts" x="570" y="259" text-anchor="middle" fill="#712B13">retracts</text>
<text class="th" x="40" y="322">C4</text>
<text class="ts" x="40" y="340">predictive shield</text>
<rect x="222" y="308" width="146" height="34" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.1"/>
<text class="ts" x="295" y="329" text-anchor="middle" fill="#085041">projects the action</text>
</svg>

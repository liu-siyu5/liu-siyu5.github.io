<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img" aria-labelledby="ti de">
<title id="ti">Load path and tolerance chain</title><desc id="de">Load runs down from the instrument tip through the arms and their turntable, the curved beams, the column slewing bearing, the guided sleeve and the cylinder, into the base. Positioning error accumulates back up the same chain.</desc>
<style>
  .ts{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#4A5552}
  .th{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
 markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
 stroke="#8B928D" stroke-width="1.5" stroke-linecap="round"
 stroke-linejoin="round"/></marker></defs>
<rect x="200" y="40" width="280" height="44" rx="8" fill="#F1EFE8" stroke="#6F6E69" stroke-width="0.6"/>
<text class="th" x="340" y="59" text-anchor="middle" fill="#444441">Instrument tip</text>
<text class="ts" x="340" y="75" text-anchor="middle" fill="#5F5E5A">where the 1 mm has to hold</text>
<line x1="340" y1="84" x2="340" y2="98" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="200" y="102" width="280" height="44" rx="8" fill="#F1EFE8" stroke="#6F6E69" stroke-width="0.6"/>
<text class="th" x="340" y="121" text-anchor="middle" fill="#444441">Instrument arms</text>
<text class="ts" x="340" y="137" text-anchor="middle" fill="#5F5E5A">another team's assembly</text>
<line x1="340" y1="146" x2="340" y2="160" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="200" y="164" width="280" height="44" rx="8" fill="#F1EFE8" stroke="#6F6E69" stroke-width="0.6"/>
<text class="th" x="340" y="183" text-anchor="middle" fill="#444441">Arm turntable</text>
<text class="ts" x="340" y="199" text-anchor="middle" fill="#5F5E5A">another team's assembly</text>
<line x1="340" y1="208" x2="340" y2="222" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="200" y="226" width="280" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/>
<text class="th" x="340" y="245" text-anchor="middle" fill="#085041">Curved beams</text>
<text class="ts" x="340" y="261" text-anchor="middle" fill="#0F6E56">slewing joint between the halves</text>
<line x1="340" y1="270" x2="340" y2="284" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="200" y="288" width="280" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.1"/>
<text class="th" x="340" y="307" text-anchor="middle" fill="#085041">Column slewing bearing</text>
<text class="ts" x="340" y="323" text-anchor="middle" fill="#0F6E56">the whole beam swings on it</text>
<line x1="340" y1="332" x2="340" y2="346" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="200" y="350" width="280" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/>
<text class="th" x="340" y="369" text-anchor="middle" fill="#085041">Sleeve and four guides</text>
<text class="ts" x="340" y="385" text-anchor="middle" fill="#0F6E56">take the moment from any bearing</text>
<line x1="340" y1="394" x2="340" y2="408" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="200" y="412" width="280" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
<text class="th" x="340" y="431" text-anchor="middle" fill="#085041">Electric cylinder</text>
<text class="ts" x="340" y="447" text-anchor="middle" fill="#0F6E56">axial thrust only</text>
<line x1="340" y1="456" x2="340" y2="470" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="200" y="474" width="280" height="44" rx="8" fill="#F1EFE8" stroke="#6F6E69" stroke-width="0.6"/>
<text class="th" x="340" y="493" text-anchor="middle" fill="#444441">Base and casters</text>
<text class="ts" x="340" y="509" text-anchor="middle" fill="#5F5E5A">footprint sets the tipping limit</text>
<path d="M180 496 L150 496 L150 62 L180 62" fill="none" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<text class="ts" x="132" y="260" text-anchor="end">Error</text>
<text class="ts" x="132" y="276" text-anchor="end">accumulates</text>
<text class="ts" x="132" y="292" text-anchor="end">upward</text>
<path d="M500 62 L530 62 L530 496 L500 496" fill="none" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<text class="ts" x="548" y="268">Load</text>
<text class="ts" x="548" y="284">runs</text>
<text class="ts" x="548" y="300">downward</text>
<rect x="200" y="550" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text class="ts" x="218" y="559">My scope</text>
<rect x="310" y="550" width="10" height="10" rx="2" fill="#F1EFE8" stroke="#6F6E69" stroke-width="0.6"/>
<text class="ts" x="328" y="559">Other teams</text>
</svg>

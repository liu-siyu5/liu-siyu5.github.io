<title id="ti">Longitudinal section through the boom</title><desc id="de">The boom cut along its centreline: a hollow tube of 36.5 mm outside diameter with a 4.5 mm wall, running up the column, around the 180 degree return bend and down to a downward-facing flange.</desc>

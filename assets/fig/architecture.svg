<svg xmlns="http://www.w3.org/2000/svg" width="680" height="714" viewBox="0 0 680 714" role="img" aria-labelledby="ti de">
<title id="ti">Appliance validation cell architecture</title><desc id="de">Camera feeds a perception node running AprilTag detection, through a three stage calibration chain, into MoveIt with the Pilz PTP planner, executed on a Franka Panda.</desc>
<style>
  .t{font:400 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .ts{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#4A5552}
  .th{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .box{fill:#fff;stroke:#C9CEC9}
  .arr{stroke:#8B928D;stroke-width:1.1;fill:none}
  .leader{stroke:#A8AEA9;stroke-width:.6;stroke-dasharray:3 3;fill:none}
  .c-teal rect,.c-teal circle{fill:#E1F5EE;stroke:#0F6E56}
  .c-teal .th{fill:#085041}.c-teal .t{fill:#085041}.c-teal .ts{fill:#0F6E56}
  .c-purple rect{fill:#EEEDFE;stroke:#534AB7}
  .c-purple .th{fill:#3C3489}.c-purple .t{fill:#3C3489}.c-purple .ts{fill:#534AB7}
  .c-coral rect{fill:#FAECE7;stroke:#993C1D}
  .c-coral .th{fill:#712B13}.c-coral .t{fill:#712B13}.c-coral .ts{fill:#993C1D}
  .c-gray rect{fill:#F1EFE8;stroke:#6F6E69}
  .c-gray .th{fill:#444441}.c-gray .t{fill:#444441}.c-gray .ts{fill:#5F5E5A}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
 markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
 stroke="#8B928D" stroke-width="1.5" stroke-linecap="round"
 stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="60" y="40" width="200" height="56" rx="8" stroke-width=".7"/><text class="th" x="160" y="60" text-anchor="middle" dominant-baseline="central">Test sequencer</text><text class="ts" x="160" y="78" text-anchor="middle" dominant-baseline="central">steps through the test set</text></g>
<path d="M70 96 L55 96 L55 476 L216 476" class="arr"/>
<line x1="210" y1="476" x2="222" y2="476" class="arr" marker-end="url(#a)"/>
<g class="c-teal"><rect x="90" y="130" width="220" height="56" rx="8" stroke-width=".7"/><text class="th" x="200" y="150" text-anchor="middle" dominant-baseline="central">IDS industrial camera</text><text class="ts" x="200" y="168" text-anchor="middle" dominant-baseline="central">legacy model</text></g>
<g class="c-gray"><rect x="370" y="130" width="220" height="56" rx="8" stroke-width=".7"/><text class="th" x="480" y="150" text-anchor="middle" dominant-baseline="central">Laser triangulation</text><text class="ts" x="480" y="168" text-anchor="middle" dominant-baseline="central">selected, not procured</text></g>
<line x1="200" y1="186" x2="200" y2="214" class="arr" marker-end="url(#a)"/>
<line x1="450" y1="186" x2="450" y2="214" class="arr" stroke-dasharray="4 4" marker-end="url(#a)"/>
<g class="c-purple"><rect x="200" y="220" width="280" height="56" rx="8" stroke-width=".7"/><text class="th" x="340" y="240" text-anchor="middle" dominant-baseline="central">Perception node</text><text class="ts" x="340" y="258" text-anchor="middle" dominant-baseline="central">AprilTag pose detection</text></g>
<line x1="340" y1="276" x2="340" y2="304" class="arr" marker-end="url(#a)"/>
<g class="c-gray"><rect x="70" y="310" width="530" height="104" rx="12" stroke-width=".7"/><text class="th" x="335" y="334" text-anchor="middle">Calibration chain</text></g>
<g class="c-purple"><rect x="90" y="350" width="150" height="48" rx="8" stroke-width=".7"/><text class="t" x="165" y="374" text-anchor="middle" dominant-baseline="central">Intrinsics</text></g>
<g class="c-purple"><rect x="260" y="350" width="150" height="48" rx="8" stroke-width=".7"/><text class="t" x="335" y="374" text-anchor="middle" dominant-baseline="central">Hand-eye</text></g>
<g class="c-purple"><rect x="430" y="350" width="150" height="48" rx="8" stroke-width=".7"/><text class="t" x="505" y="374" text-anchor="middle" dominant-baseline="central">Tool centre point</text></g>
<line x1="240" y1="374" x2="254" y2="374" class="arr" marker-end="url(#a)"/>
<line x1="410" y1="374" x2="424" y2="374" class="arr" marker-end="url(#a)"/>
<line x1="335" y1="414" x2="335" y2="442" class="arr" marker-end="url(#a)"/>
<g class="c-coral"><rect x="225" y="448" width="220" height="56" rx="8" stroke-width=".7"/><text class="th" x="335" y="468" text-anchor="middle" dominant-baseline="central">MoveIt</text><text class="ts" x="335" y="486" text-anchor="middle" dominant-baseline="central">Pilz PTP planner, ROS 1</text></g>
<line x1="335" y1="504" x2="335" y2="532" class="arr" marker-end="url(#a)"/>
<g class="c-teal"><rect x="195" y="538" width="290" height="56" rx="8" stroke-width=".7"/><text class="th" x="340" y="558" text-anchor="middle" dominant-baseline="central">Franka Panda via franka_ros</text><text class="ts" x="340" y="576" text-anchor="middle" dominant-baseline="central">gripper with custom printed fingers</text></g>
<path d="M485 566 L630 566 L630 374 L608 374" class="arr"/>
<line x1="614" y1="374" x2="602" y2="374" class="arr" marker-end="url(#a)"/>
<line x1="340" y1="594" x2="340" y2="622" class="arr" marker-end="url(#a)"/>
<g class="c-teal"><rect x="225" y="628" width="230" height="56" rx="8" stroke-width=".7"/><text class="th" x="340" y="648" text-anchor="middle" dominant-baseline="central">Appliance stand-in</text><text class="ts" x="340" y="666" text-anchor="middle" dominant-baseline="central">1:1 mockup, unit in transit</text></g>
</svg>

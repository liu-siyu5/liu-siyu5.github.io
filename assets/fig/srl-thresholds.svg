<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" aria-labelledby="ti de">
<title id="ti">Threshold geometry around the mouth</title><desc id="de">Nested boundaries around the mouth: contact begins at the outermost, then the success distance, then the comfort limit, then the danger limit innermost. Success is declared outside the danger boundary.</desc>
<style>
  .ts{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#4A5552}
  .th{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .leader{stroke:#A8AEA9;stroke-width:.6;stroke-dasharray:3 3;fill:none}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
 markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
 stroke="#8B928D" stroke-width="1.5" stroke-linecap="round"
 stroke-linejoin="round"/></marker>
<marker id="art" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
 markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
 stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round"
 stroke-linejoin="round"/></marker>
<marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
 markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
 stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round"
 stroke-linejoin="round"/></marker></defs>
<circle cx="250" cy="220" r="160" fill="none" stroke="#0F6E56" stroke-width="1" stroke-dasharray="6 5"/>
<circle cx="250" cy="220" r="120" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.1"/>
<circle cx="250" cy="220" r="112" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.1"/>
<circle cx="250" cy="220" r="80" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.3"/>
<circle cx="250" cy="220" r="5" fill="#16211F"/>
<text class="ts" x="250" y="248" text-anchor="middle">mouth</text>
<line x1="404" y1="150" x2="470" y2="128" class="leader"/>
<text class="ts" x="478" y="124" text-anchor="start">contact begins</text>
<line x1="368" y1="163" x2="470" y2="170" class="leader"/>
<text class="ts" x="478" y="166" text-anchor="start">success declared here</text>
<line x1="360" y1="168" x2="470" y2="212" class="leader"/>
<text class="ts" x="478" y="208" text-anchor="start">comfort limit</text>
<line x1="322" y1="178" x2="470" y2="254" class="leader"/>
<text class="ts" x="478" y="250" text-anchor="start">danger limit</text>
<line x1="250" y1="220" x2="250" y2="60" stroke="#A8AEA9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="258" y="72" text-anchor="start">spoon tip approaches</text>
<line x1="250" y1="96" x2="250" y2="126" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<text class="ts" x="40" y="404" text-anchor="start">Success sits outside the danger boundary, so an episode cannot succeed and violate at once.</text>
<text class="ts" x="40" y="422" text-anchor="start">The environment asserts that relation at start-up.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="306" viewBox="0 0 680 306" role="img" aria-labelledby="ti de">
<title id="ti">Pin and socket contact</title><desc id="de">A solid pin of fixed size enters a socket. Contact springs reach out and grip it at two points. Their stiffness and the friction at those points set the force needed to pull the pin back out.</desc>
<style>
  .ts{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#4A5552}
  .th{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .leader{stroke:#A8AEA9;stroke-width:.6;stroke-dasharray:3 3;fill:none}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
 markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
 stroke="#8B928D" stroke-width="1.5" stroke-linecap="round"
 stroke-linejoin="round"/></marker>
<pattern id="hx" width="8" height="8" patternUnits="userSpaceOnUse"
 patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8"
 stroke="#7f8b86" stroke-width="0.7"/></pattern></defs>
<rect x="60" y="158" width="262" height="28" rx="3" fill="#F1EFE8" stroke="#6F6E69" stroke-width="0.8"/>
<rect x="60" y="158" width="262" height="28" rx="3" fill="url(#hx)"/>
<text class="ts" x="178" y="177" text-anchor="middle">Pin, solid, fixed size</text>
<rect x="536" y="112" width="58" height="120" rx="4" fill="#F1EFE8" stroke="#6F6E69" stroke-width="0.8"/>
<path d="M300 152 L420 130 L536 130" fill="none" stroke="#0F6E56" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M300 192 L420 214 L536 214" fill="none" stroke="#0F6E56" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="302" cy="156" r="5.5" fill="#D85A30"/>
<circle cx="302" cy="188" r="5.5" fill="#D85A30"/>
<line x1="110" y1="96" x2="250" y2="96" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<text class="ts" x="180" y="88" text-anchor="middle">Insertion</text>
<line x1="250" y1="258" x2="110" y2="258" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<text class="ts" x="180" y="276" text-anchor="middle">Withdrawal</text>
<line x1="430" y1="130" x2="470" y2="74" class="leader"/>
<text class="ts" x="478" y="70" text-anchor="start">Contact springs</text>
<text class="ts" x="478" y="86" text-anchor="start">grip the pin</text>
<line x1="312" y1="192" x2="380" y2="252" class="leader"/>
<text class="ts" x="388" y="248" text-anchor="start">Contact points; friction here</text>
<text class="ts" x="388" y="264" text-anchor="start">sets the force to pull out</text>
<line x1="566" y1="236" x2="566" y2="266" class="leader"/>
<text class="ts" x="566" y="282" text-anchor="middle">Housing</text>
</svg>

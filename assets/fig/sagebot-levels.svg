<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" aria-labelledby="ti de">
<title id="ti">Three independent levels and my scope</title><desc id="de">At the top, two curved beams joined by a slewing bearing so the front half can swing through a limited arc. Below, a separate turntable carrying four instrument arms, built by another team. Underneath, a telescoping column raised by an electric cylinder and guided by rails in all four corners of the sleeve.</desc>
<style>
  .t{font:400 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .ts{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#4A5552}
  .th{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .leader{stroke:#A8AEA9;stroke-width:.6;stroke-dasharray:3 3;fill:none}
</style>

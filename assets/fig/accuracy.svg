<svg xmlns="http://www.w3.org/2000/svg" width="680" height="258" viewBox="0 0 680 258" role="img" aria-labelledby="ti de">
<title id="ti">Measured accuracy against the 2 mm requirement</title><desc id="de">System positioning error stayed under 1.4 mm against a 2 mm requirement. Repeatability after switching to Pilz PTP fell between 0.2 and 1.2 mm.</desc>

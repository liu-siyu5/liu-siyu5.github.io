<svg xmlns="http://www.w3.org/2000/svg" width="680" height="478" viewBox="0 0 680 478" role="img" aria-labelledby="ti de">
<title id="ti">Liquid level sensor selection</title><desc id="de">Transparent container rules out lidar and radar; laser triangulation selected over time-of-flight for micron-level resolution.</desc>
<style>
  .t{font:400 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .ts{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#4A5552}
  .th{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .box{fill:#fff;stroke:#C9CEC9}
  .arr{stroke:#8B928D;stroke-width:1.1;fill:none}
  .leader{stroke:#A8AEA9;stroke-width:.6;stroke-dasharray:3 3;fill:none}
  .c-teal rect,.c-teal circle{fill:#E1F5EE;stroke:#0F6E56}
  .c-teal .th{fill:#085041}.c-teal .t{fill:#085041}.c-teal .ts{fill:#0F6E56}
  .c-purple rect{fill:#EEEDFE;stroke:#534AB7}
  .c-purple .th{fill:#3C3489}.c-purple .t{fill:#3C3489}.c-purple .ts{fill:#534AB7}
  .c-coral rect{fill:#FAECE7;stroke:#993C1D}
  .c-coral .th{fill:#712B13}.c-coral .t{fill:#712B13}.c-coral .ts{fill:#993C1D}
  .c-gray rect{fill:#F1EFE8;stroke:#6F6E69}
  .c-gray .th{fill:#444441}.c-gray .t{fill:#444441}.c-gray .ts{fill:#5F5E5A}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
 markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
 stroke="#8B928D" stroke-width="1.5" stroke-linecap="round"
 stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="170" y="40" width="340" height="56" rx="8" stroke-width=".7"/><text class="th" x="340" y="60" text-anchor="middle" dominant-baseline="central">Requirement</text><text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">Liquid level in a transparent container</text></g>
<line x1="340" y1="96" x2="340" y2="122" class="arr" marker-end="url(#a)"/>
<g class="c-gray"><rect x="170" y="128" width="340" height="56" rx="8" stroke-width=".7"/><text class="th" x="340" y="148" text-anchor="middle" dominant-baseline="central">Lidar and radar ruled out</text><text class="ts" x="340" y="166" text-anchor="middle" dominant-baseline="central">Beam passes through or scatters</text></g>
<line x1="340" y1="184" x2="340" y2="210" class="arr" marker-end="url(#a)"/>
<g class="c-teal"><rect x="170" y="216" width="340" height="56" rx="8" stroke-width=".7"/><text class="th" x="340" y="236" text-anchor="middle" dominant-baseline="central">ToF vs laser triangulation</text><text class="ts" x="340" y="254" text-anchor="middle" dominant-baseline="central">Compared on achievable accuracy</text></g>
<line x1="340" y1="272" x2="340" y2="298" class="arr" marker-end="url(#a)"/>
<g class="c-coral"><rect x="170" y="304" width="340" height="56" rx="8" stroke-width=".7"/><text class="th" x="340" y="324" text-anchor="middle" dominant-baseline="central">Laser triangulation selected</text><text class="ts" x="340" y="342" text-anchor="middle" dominant-baseline="central">Micron-level resolution</text></g>
<line x1="340" y1="360" x2="340" y2="386" class="arr" marker-end="url(#a)"/>
<g class="c-gray"><rect x="170" y="392" width="340" height="56" rx="8" stroke-width=".7"/><text class="th" x="340" y="412" text-anchor="middle" dominant-baseline="central">Recommendation adopted</text><text class="ts" x="340" y="430" text-anchor="middle" dominant-baseline="central">Procurement fell outside my internship</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" aria-labelledby="ti de">
<title id="ti">Power and control chain</title><desc id="de">A 48 volt 25 amp-hour lithium battery feeds three buck and linear regulator stages down to 5 volts. An MPU6050 supplies attitude through its on-chip motion processor to an STM32F103RCT6 running incremental PID, which drives the three axis motors through a driver stage with encoder feedback.</desc>
<style>
  .t{font:400 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .ts{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#4A5552}
  .th{font:600 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#16211F}
  .leader{stroke:#A8AEA9;stroke-width:.6;stroke-dasharray:3 3;fill:none}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
 markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
 stroke="#8B928D" stroke-width="1.5" stroke-linecap="round"
 stroke-linejoin="round"/></marker></defs>
<g><rect x="45" y="40" width="140" height="58" rx="8" fill="#F1EFE8" stroke="#6F6E69" stroke-width="0.7"/><text class="th" x="115" y="62" text-anchor="middle" fill="#444441">Battery</text><text class="ts" x="115" y="81" text-anchor="middle" fill="#5F5E5A">48 V, 25 Ah</text></g>
<line x1="185" y1="69" x2="193" y2="69" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<g><rect x="195" y="40" width="140" height="58" rx="8" fill="#F1EFE8" stroke="#6F6E69" stroke-width="0.7"/><text class="th" x="265" y="62" text-anchor="middle" fill="#444441">LM5576</text><text class="ts" x="265" y="81" text-anchor="middle" fill="#5F5E5A">48 V to 24 V</text></g>
<line x1="335" y1="69" x2="343" y2="69" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<g><rect x="345" y="40" width="140" height="58" rx="8" fill="#F1EFE8" stroke="#6F6E69" stroke-width="0.7"/><text class="th" x="415" y="62" text-anchor="middle" fill="#444441">LM2596T-12</text><text class="ts" x="415" y="81" text-anchor="middle" fill="#5F5E5A">24 V to 12 V</text></g>
<line x1="485" y1="69" x2="493" y2="69" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<g><rect x="495" y="40" width="140" height="58" rx="8" fill="#F1EFE8" stroke="#6F6E69" stroke-width="0.7"/><text class="th" x="565" y="62" text-anchor="middle" fill="#444441">LM340MP-5.0</text><text class="ts" x="565" y="81" text-anchor="middle" fill="#5F5E5A">12 V to 5 V</text></g>
<g><rect x="45" y="170" width="140" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><text class="th" x="115" y="192" text-anchor="middle" fill="#085041">MPU6050</text><text class="ts" x="115" y="211" text-anchor="middle" fill="#0F6E56">attitude via DMP</text></g>
<line x1="185" y1="199" x2="193" y2="199" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<g><rect x="195" y="170" width="140" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><text class="th" x="265" y="192" text-anchor="middle" fill="#085041">STM32F103RCT6</text><text class="ts" x="265" y="211" text-anchor="middle" fill="#0F6E56">incremental PID</text></g>
<line x1="335" y1="199" x2="343" y2="199" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>

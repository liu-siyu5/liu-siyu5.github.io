<line x1="485" y1="199" x2="493" y2="199" stroke="#8B928D" stroke-width="1.1" marker-end="url(#ar)"/>
<g><rect x="495" y="170" width="140" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/><text class="th" x="565" y="192" text-anchor="middle" fill="#085041">Axis motors</text><text class="ts" x="565" y="211" text-anchor="middle" fill="#0F6E56">three axes</text></g>
